<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suivi des Mesures & Graphique Interactif</title>
    <!-- Inclusion de Chart.js pour le graphique -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --danger-color: #e74c3c;
            --bg-color: #f8f9fa;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: #333;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        h1, h2 {
            color: var(--primary-color);
            margin-top: 0;
        }

        .form-group {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .input-control {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 150px;
        }

        label {
            font-size: 0.9em;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input, select, button {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1em;
        }

        button.btn-add {
            background-color: var(--accent-color);
            color: white;
            border: none;
            cursor: pointer;
            align-self: flex-end;
            transition: background 0.2s;
        }

        button.btn-add:hover {
            background-color: #2980b9;
        }

        .chart-container {
            position: relative;
            margin-bottom: 30px;
            height: 350px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid #eee;
        }

        th {
            background-color: #f1f3f5;
        }

        .btn-delete {
            background-color: transparent;
            color: var(--danger-color);
            border: 1px solid var(--danger-color);
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-delete:hover {
            background-color: var(--danger-color);
            color: white;
        }

        .empty-state {
            text-align: center;
            color: #888;
            padding: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Suivi des Mesures</h1>

    <!-- Formulaire d'ajout -->
    <div class="form-group">
        <div class="input-control">
            <label for="metricType">Type de mesure</label>
            <select id="metricType">
                <option value="poids">Poids (kg)</option>
                <option value="temperature">Température (°C)</option>
            </select>
        </div>
        <div class="input-control">
            <label for="measureDate">Date</label>
            <input type="date" id="measureDate">
        </div>
        <div class="input-control">
            <label for="measureValue">Valeur</label>
            <input type="number" step="0.1" id="measureValue" placeholder="ex: 72.5">
        </div>
        <button class="btn-add" onclick="addMeasure()">Ajouter</button>
    </div>

    <!-- Zone Graphique -->
    <h2>Tendance</h2>
    <div class="chart-container">
        <canvas id="metricsChart"></canvas>
    </div>

    <!-- Historique / Liste des points -->
    <h2>Historique des données</h2>
    <table>
        <thead>
            <tr>
                <th>Type</th>
                <th>Date</th>
                <th>Valeur</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="dataTableBody">
            <!-- Rempli dynamiquement -->
        </tbody>
    </table>
</div>

<script>
    // Données initiales d'exemple
    let measures = [
        { id: 1, type: 'poids', date: '2026-08-01', value: 75.0 },
        { id: 2, type: 'poids', date: '2026-08-03', value: 74.2 },
        { id: 3, type: 'poids', date: '2026-08-05', value: 74.5 },
        { id: 4, type: 'poids', date: '2026-08-07', value: 73.8 }
    ];

    let chartInstance = null;

    // Initialisation au chargement de la page
    window.onload = () => {
        document.getElementById('measureDate').valueAsDate = new Date();
        initChart();
        updateUI();
    };

    // Initialisation du graphique Chart.js
    function initChart() {
        const ctx = document.getElementById('metricsChart').getContext('2d');
        chartInstance = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'Poids (kg)',
                    data: [],
                    borderColor: '#3498db',
                    backgroundColor: 'rgba(52, 152, 219, 0.1)',
                    borderWidth: 2,
                    fill: true,
                    tension: 0.3, // Rend la courbe fluide
                    pointRadius: 6,
                    pointHoverRadius: 8
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    tooltip: {
                        callbacks: {
                            afterBody: () => 'Cliquez sur un point du graphique pour le supprimer.'
                        }
                    }
                },
                // Action au clic direct sur un point du graphique
                onClick: (e, elements) => {
                    if (elements.length > 0) {
                        const index = elements[0].index;
                        const currentType = document.getElementById('metricType').value;
                        const filteredMeasures = getFilteredMeasures(currentType);
                        const targetItem = filteredMeasures[index];

                        if (targetItem) {
                            deleteMeasure(targetItem.id);
                        }
                    }
                },
                scales: {
                    x: {
                        title: { display: true, text: 'Date' }
                    },
                    y: {
                        title: { display: true, text: 'Valeur' },
                        beginAtZero: false
                    }
                }
            }
        });

        // Écouteur pour changer le type de métrique affichée
        document.getElementById('metricType').addEventListener('change', updateUI);
    }

    // Récupère les mesures filtrées et triées par date
    function getFilteredMeasures(type) {
        return measures
            .filter(m => m.type === type)
            .sort((a, b) => new Date(a.date) - new Date(b.date));
    }

    // Ajouter une nouvelle mesure
    function addMeasure() {
        const type = document.getElementById('metricType').value;
        const date = document.getElementById('measureDate').value;
        const value = parseFloat(document.getElementById('measureValue').value);

        if (!date || isNaN(value)) {
            alert("Veuillez remplir correctement la date et la valeur.");
            return;
        }

        const newMeasure = {
            id: Date.now(), // Identifiant unique
            type: type,
            date: date,
            value: value
        };

        measures.push(newMeasure);
        document.getElementById('measureValue').value = '';
        
        updateUI();
    }

    // Supprimer une mesure via son ID
    function deleteMeasure(id) {
        measures = measures.filter(m => m.id !== id);
        updateUI();
    }

    // Mettre à jour l'interface (Tableau + Graphique)
    function updateUI() {
        const currentType = document.getElementById('metricType').value;
        const filteredData = getFilteredMeasures(currentType);

        // 1. Mise à jour du Graphique
        chartInstance.data.labels = filteredData.map(m => m.date);
        chartInstance.data.datasets[0].data = filteredData.map(m => m.value);
        chartInstance.data.datasets[0].label = currentType === 'poids' ? 'Poids (kg)' : 'Température (°C)';
        chartInstance.update();

        // 2. Mise à jour de la liste / tableau
        const tbody = document.getElementById('dataTableBody');
        tbody.innerHTML = '';

        if (filteredData.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" class="empty-state">Aucune donnée enregistrée pour ce type.</td></tr>';
            return;
        }

        filteredData.forEach(item => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><strong>${item.type === 'poids' ? 'Poids' : 'Température'}</strong></td>
                <td>${item.date}</td>
                <td>${item.value} ${item.type === 'poids' ? 'kg' : '°C'}</td>
                <td>
                    <button class="btn-delete" onclick="deleteMeasure(${item.id})">Supprimer</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }
</script>

</body>
</html>
