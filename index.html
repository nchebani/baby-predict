<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suivi Bébé & Famille</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen pb-12">

    <!-- En-tête -->
    <header class="bg-indigo-600 text-white shadow-md p-4 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-baby"></i> Suivi Bébé & Famille
            </h1>
            <div class="flex items-center gap-3">
                <span id="userBadge" class="bg-indigo-700 text-xs px-2,5 py-1 rounded-full font-medium">Parent</span>
            </div>
        </div>
    </header>

    <!-- Conteneur Principal -->
    <main class="max-w-4xl mx-auto p-4 space-y-6">

        <!-- Navigation par onglets -->
        <div class="flex border-b border-slate-200 bg-white rounded-t-xl overflow-hidden shadow-sm">
            <button onclick="switchTab('agenda')" id="tab-agenda" class="flex-1 py-3 px-4 font-semibold text-center border-b-2 border-indigo-600 text-indigo-600 transition">
                <i class="fa-solid fa-calendar-days mr-1"></i> Agenda
            </button>
            <button onclick="switchTab('suivi')" id="tab-suivi" class="flex-1 py-3 px-4 font-semibold text-center text-slate-500 hover:text-slate-700 transition">
                <i class="fa-solid fa-baby-carriage mr-1"></i> Suivi Bébé
            </button>
        </div>

        <!-- SECTION AGENDA -->
        <section id="section-agenda" class="space-y-6">
            <!-- Formulaire Agenda -->
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-100">
                <h2 id="formAgendaTitle" class="text-lg font-bold mb-4 text-slate-700 flex items-center gap-2">
                    <i class="fa-solid fa-calendar-plus text-indigo-500"></i> Ajouter un événement
                </h2>
                <form id="agendaForm" onsubmit="addAgendaEntry(event)" class="space-y-4">
                    <input type="hidden" id="editAgendaIndex" value="-1">
                    
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Titre</label>
                        <input type="text" id="agendaTitle" required placeholder="Rendez-vous pédiatre, Nounou..." class="w-full p-2,5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Catégorie</label>
                            <select id="agendaCategory" class="w-full p-2,5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                                <option value="Medical">Medical</option>
                                <option value="Garde">Garde / Nounou</option>
                                <option value="Activité">Activité</option>
                                <option value="Rappel">Rappel</option>
                                <option value="Autre">Autre</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Attribué à</label>
                            <select id="agendaAssignee" class="w-full p-2,5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                                <option value="Papa">Papa</option>
                                <option value="Maman">Maman</option>
                                <option value="Les deux">Les deux</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Date début</label>
                            <input type="date" id="agendaStartDate" required class="w-full p-2 border border-slate-300 rounded-lg text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Heure début</label>
                            <input type="time" id="agendaStartTime" required class="w-full p-2 border border-slate-300 rounded-lg text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Date fin</label>
                            <input type="date" id="agendaEndDate" required class="w-full p-2 border border-slate-300 rounded-lg text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Heure fin</label>
                            <input type="time" id="agendaEndTime" required class="w-full p-2 border border-slate-300 rounded-lg text-sm">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Notes / Détails</label>
                        <textarea id="agendaNotes" rows="2" placeholder="Adresse, documents à prendre..." class="w-full p-2,5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"></textarea>
                    </div>

                    <div class="flex gap-2 pt-2">
                        <button type="submit" id="btnSubmitAgenda" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2,5 rounded-lg shadow transition">
                            Ajouter à l'agenda
                        </button>
                        <button type="button" id="btnCancelAgendaEdit" onclick="cancelAgendaEdit()" class="hidden bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold px-4 py-2,5 rounded-lg transition">
                            Annuler
                        </button>
                    </div>
                </form>
            </div>

            <!-- Liste des événements Agenda -->
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-100">
                <h3 class="text-md font-bold mb-3 text-slate-700">Événements à venir</h3>
                <div id="agendaList" class="space-y-3">
                    <!-- Généré dynamiquement -->
                </div>
            </div>
        </section>

        <!-- SECTION SUIVI (Masquée par défaut) -->
        <section id="section-suivi" class="hidden space-y-6">
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-100 text-center py-8 text-slate-500">
                <i class="fa-solid fa-baby-carriage text-4xl mb-2 text-indigo-300"></i>
                <p>Module de suivi bébé actif.</p>
            </div>
        </section>

    </main>

    <!-- JavaScript Principal -->
    <script>
        // Données globales
        let currentUser = "Parent";
        window.agendaEntries = JSON.parse(localStorage.getItem('agendaEntries')) || [];

        // Gestion de l'affichage des onglets
        function switchTab(tabName) {
            const agendaSec = document.getElementById('section-agenda');
            const suiviSec = document.getElementById('section-suivi');
            const tabAgenda = document.getElementById('tab-agenda');
            const tabSuivi = document.getElementById('tab-suivi');

            if (tabName === 'agenda') {
                agendaSec.classList.remove('hidden');
                suiviSec.classList.add('hidden');
                tabAgenda.className = "flex-1 py-3 px-4 font-semibold text-center border-b-2 border-indigo-600 text-indigo-600 transition";
                tabSuivi.className = "flex-1 py-3 px-4 font-semibold text-center text-slate-500 hover:text-slate-700 transition";
            } else {
                agendaSec.classList.add('hidden');
                suiviSec.classList.remove('hidden');
                tabSuivi.className = "flex-1 py-3 px-4 font-semibold text-center border-b-2 border-indigo-600 text-indigo-600 transition";
                tabAgenda.className = "flex-1 py-3 px-4 font-semibold text-center text-slate-500 hover:text-slate-700 transition";
            }
        }

        // Sauvegarde dans le stockage local
        function saveAllToStorage() {
            localStorage.setItem('agendaEntries', JSON.stringify(window.agendaEntries));
        }

        // Soumission du formulaire d'agenda
        function addAgendaEntry(e) {
            e.preventDefault();
            const editIdx = parseInt(document.getElementById('editAgendaIndex').value);

            const entry = {
                title: document.getElementById('agendaTitle').value.trim(),
                category: document.getElementById('agendaCategory').value,
                startDate: document.getElementById('agendaStartDate').value,
                startTime: document.getElementById('agendaStartTime').value,
                endDate: document.getElementById('agendaEndDate').value,
                endTime: document.getElementById('agendaEndTime').value,
                assignee: document.getElementById('agendaAssignee').value,
                notes: document.getElementById('agendaNotes').value.trim(),
                author: currentUser || "Parent"
            };

            if (!window.agendaEntries) window.agendaEntries = [];

            if (editIdx >= 0) {
                window.agendaEntries[editIdx] = entry;
            } else {
                window.agendaEntries.push(entry);
            }

            saveAllToStorage();
            renderAgendaEntries();
            cancelAgendaEdit();
        }

        // Édition d'une entrée
        function editAgendaEntry(idx) {
            const entry = window.agendaEntries[idx];
            if (!entry) return;

            document.getElementById('editAgendaIndex').value = idx;
            document.getElementById('agendaTitle').value = entry.title || '';
            document.getElementById('agendaCategory').value = entry.category || 'Medical';
            document.getElementById('agendaStartDate').value = entry.startDate || '';
            document.getElementById('agendaStartTime').value = entry.startTime || '09:00';
            document.getElementById('agendaEndDate').value = entry.endDate || '';
            document.getElementById('agendaEndTime').value = entry.endTime || '10:00';
            document.getElementById('agendaAssignee').value = entry.assignee || 'Papa';
            document.getElementById('agendaNotes').value = entry.notes || '';

            document.getElementById('formAgendaTitle').innerHTML = `<i class="fa-solid fa-pen text-indigo-500"></i> Modifier l'événement`;
            document.getElementById('btnSubmitAgenda').innerText = "Mettre à jour";
            document.getElementById('btnCancelAgendaEdit').classList.remove('hidden');

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Réinitialisation du formulaire
        function cancelAgendaEdit() {
            document.getElementById('editAgendaIndex').value = "-1";
            document.getElementById('agendaForm').reset();
            const todayStr = new Date().toISOString().split('T')[0];
            document.getElementById('agendaStartDate').value = todayStr;
            document.getElementById('agendaEndDate').value = todayStr;
            document.getElementById('agendaStartTime').value = "09:00";
            document.getElementById('agendaEndTime').value = "10:00";

            document.getElementById('formAgendaTitle').innerHTML = `<i class="fa-solid fa-calendar-plus text-indigo-500"></i> Ajouter un événement`;
            document.getElementById('btnSubmitAgenda').innerText = "Ajouter à l'agenda";
            document.getElementById('btnCancelAgendaEdit').classList.add('hidden');
        }

        // Suppression d'une entrée
        function deleteAgendaEntry(idx) {
            if (confirm("Voulez-vous vraiment supprimer cet événement ?")) {
                window.agendaEntries.splice(idx, 1);
                saveAllToStorage();
                renderAgendaEntries();
            }
        }

        // Affichage de la liste des événements
        function renderAgendaEntries() {
            const listEl = document.getElementById('agendaList');
            if (!listEl) return;

            if (!window.agendaEntries || window.agendaEntries.length === 0) {
                listEl.innerHTML = `<p class="text-sm text-slate-400 italic text-center py-4">Aucun événement enregistré.</p>`;
                return;
            }

            // Tri par date
            window.agendaEntries.sort((a, b) => new Date(`${a.startDate}T${a.startTime}`) - new Date(`${b.startDate}T${b.startTime}`));

            listEl.innerHTML = window.agendaEntries.map((item, idx) => `
                <div class="p-3 bg-slate-50 rounded-lg border border-slate-200 flex flex-col md:flex-row justify-between items-start md:items-center gap-2">
                    <div class="space-y-1">
                        <div class="flex items-center gap-2">
                            <span class="font-bold text-slate-800">${item.title}</span>
                            <span class="text-xs px-2 py-0,5 bg-indigo-100 text-indigo-700 rounded-full font-medium">${item.category}</span>
                            <span class="text-xs px-2 py-0,5 bg-slate-200 text-slate-600 rounded-full">${item.assignee}</span>
                        </div>
                        <div class="text-xs text-slate-500">
                            <i class="fa-regular fa-clock mr-1"></i> ${item.startDate} (${item.startTime}) - ${item.endDate} (${item.endTime})
                        </div>
                        ${item.notes ? `<div class="text-xs text-slate-600 italic bg-white p-1,5 rounded border border-slate-100">${item.notes}</div>` : ''}
                    </div>
                    <div class="flex gap-2 self-end md:self-center">
                        <button onclick="editAgendaEntry(${idx})" class="text-xs text-indigo-600 hover:text-indigo-800 p-1,5 bg-white rounded border border-slate-200 shadow-sm">
                            <i class="fa-solid fa-pen"></i>
                        </button>
                        <button onclick="deleteAgendaEntry(${idx})" class="text-xs text-rose-600 hover:text-rose-800 p-1,5 bg-white rounded border border-slate-200 shadow-sm">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // Chargement initial
        window.addEventListener('DOMContentLoaded', () => {
            cancelAgendaEdit();
            renderAgendaEntries();
        });
    </script>
</body>
</html>
