<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suivi & Tendance du Poids</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Chart.js & Plugins -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
    <style>
        body { background: #07070a; color: #e2e8f0; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(23, 23, 33, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen">

    <div class="max-w-4xl mx-auto space-y-6">
        
        <!-- En-tête -->
        <header class="flex justify-between items-center glass p-6 rounded-3xl">
            <div>
                <h1 class="text-2xl font-black italic uppercase text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-400">
                    Suivi de Poids Interactif
                </h1>
                <p class="text-xs text-slate-400 font-medium mt-1">Ajoutez, supprimez et observez l'ajustement de la tendance en temps réel.</p>
            </div>
            <div class="text-right">
                <span class="text-[10px] font-bold uppercase tracking-widest text-slate-500 block">Dernier Poids</span>
                <span id="stat-last-weight" class="text-2xl font-black text-purple-400">-- kg</span>
            </div>
        </header>

        <!-- Formulaire de saisie -->
        <section class="glass p-6 rounded-3xl space-y-4">
            <h2 class="text-xs font-black uppercase text-purple-400 tracking-wider italic">
                <i class="fas fa-plus-circle mr-2"></i>Ajouter une nouvelle mesure
            </h2>
            <form id="weight-form" class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Date & Heure</label>
                    <input type="datetime-local" id="input-date" required class="w-full bg-white/5 border border-white/10 p-3 rounded-xl text-white text-sm outline-none focus:border-purple-500 transition-all">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Poids (kg)</label>
                    <input type="number" step="0.001" id="input-weight" placeholder="Ex: 3.250" required class="w-full bg-white/5 border border-white/10 p-3 rounded-xl text-white text-sm outline-none focus:border-purple-500 transition-all">
                </div>
                <div class="flex items-end">
                    <button type="submit" class="w-full bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white font-black py-3 rounded-xl uppercase text-xs tracking-wider transition-all shadow-lg active:scale-95">
                        <i class="fas fa-save mr-1"></i> Enregistrer
                    </button>
                </div>
            </form>
        </section>

        <!-- Graphique interactif -->
        <section class="glass p-6 rounded-3xl space-y-3">
            <div class="flex justify-between items-center">
                <h2 class="text-xs font-black uppercase text-purple-400 tracking-wider italic">
                    <i class="fas fa-chart-line mr-2"></i>Courbe & Tendance
                </h2>
                <span class="text-[10px] text-slate-400 italic">Astuce : Cliquez sur un point du graphique pour le supprimer</span>
            </div>
            <div class="w-full h-72 relative">
                <canvas id="weightChart"></canvas>
            </div>
        </section>

        <!-- Liste des mesures enregistrées -->
        <section class="glass p-6 rounded-3xl space-y-4">
            <h2 class="text-xs font-black uppercase text-purple-400 tracking-wider italic">
                <i class="fas fa-list mr-2"></i>Historique des données
            </h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs border-collapse">
                    <thead>
                        <tr class="border-b border-white/10 text-slate-400 uppercase font-bold text-[10px]">
                            <th class="p-3">Date & Heure</th>
                            <th class="p-3">Poids (kg)</th>
                            <th class="p-3 text-right">Action</th>
                        </tr>
                    </thead>
                    <tbody id="weight-table-body" class="divide-y divide-white/5">
                        <!-- Rempli en JS -->
                    </tbody>
                </table>
            </div>
        </section>

    </div>

    <script>
        // Initialisation des données par défaut
        let weightData = [
            { id: 1, date: "2026-08-01T08:00", weight: 3.100 },
            { id: 2, date: "2026-08-03T09:30", weight: 3.180 },
            { id: 3, date: "2026-08-05T08:15", weight: 3.240 },
            { id: 4, date: "2026-08-07T09:00", weight: 3.310 }
        ];

        // Pré-remplir la date/heure actuelle dans le formulaire
        const dateInput = document.getElementById('input-date');
        const now = new Date();
        now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
        dateInput.value = now.toISOString().slice(0, 16);

        // Calcul de la ligne de tendance linéaire
        function calculateLinearRegression(data) {
            if (data.length < 2) return data.map(d => d.weight);

            const n = data.length;
            let sumX = 0, sumY = 0, sumXY = 0, sumXX = 0;

            data.forEach((pt, index) => {
                sumX += index;
                sumY += pt.weight;
                sumXY += index * pt.weight;
                sumXX += index * index;
            });

            const slope = (n * sumXY - sumX * sumY) / (n * sumXX - sumX * sumX);
            const intercept = (sumY - slope * sumX) / n;

            return data.map((_, index) => slope * index + intercept);
        }

        // Configuration Chart.js
        const ctx = document.getElementById('weightChart').getContext('2d');
        Chart.register(ChartDataLabels);

        const weightChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [
                    {
                        label: 'Poids (kg)',
                        data: [],
                        borderColor: '#ec4899',
                        backgroundColor: 'rgba(236, 72, 153, 0.2)',
                        borderWidth: 3,
                        pointRadius: 6,
                        pointHoverRadius: 9,
                        pointBackgroundColor: '#f472b6',
                        fill: true,
                        tension: 0.2
                    },
                    {
                        label: 'Tendance Instantanée',
                        data: [],
                        borderColor: '#a855f7',
                        borderWidth: 2,
                        borderDash: [6, 6],
                        pointRadius: 0,
                        fill: false
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                onClick: (event, activeElements) => {
                    if (activeElements.length > 0) {
                        const index = activeElements[0].index;
                        const targetId = weightData[index].id;
                        deleteEntry(targetId);
                    }
                },
                plugins: {
                    legend: {
                        labels: { color: '#94a3b8', font: { size: 11, weight: 'bold' } }
                    },
                    datalabels: {
                        align: 'top',
                        color: '#f472b6',
                        font: { weight: 'bold', size: 10 },
                        formatter: (val, context) => context.datasetIndex === 0 ? val.toFixed(3) + ' kg' : ''
                    }
                },
                scales: {
                    x: {
                        ticks: { color: '#94a3b8', font: { size: 10 } },
                        grid: { color: 'rgba(255, 255, 255, 0.05)' }
                    },
                    y: {
                        ticks: { color: '#94a3b8', font: { size: 10 } },
                        grid: { color: 'rgba(255, 255, 255, 0.05)' }
                    }
                }
            }
        });

        // Mise à jour globale de l'interface
        function updateUI() {
            // Trier les données par date croissante
            weightData.sort((a, b) => new Date(a.date) - new Date(b.date));

            // Mettre à jour les libellés et séries du graphique
            const labels = weightData.map(d => {
                const dt = new Date(d.date);
                return dt.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' }) + ' ' + 
                       dt.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
            });
            const weights = weightData.map(d => d.weight);
            const trend = calculateLinearRegression(weightData);

            weightChart.data.labels = labels;
            weightChart.data.datasets[0].data = weights;
            weightChart.data.datasets[1].data = trend;
            weightChart.update();

            // Mettre à jour l'en-tête
            const lastEntry = weightData[weightData.length - 1];
            document.getElementById('stat-last-weight').innerText = lastEntry ? `${lastEntry.weight.toFixed(3)} kg` : '-- kg';

            // Mettre à jour la table HTML
            const tbody = document.getElementById('weight-table-body');
            tbody.innerHTML = '';

            if (weightData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="p-4 text-center text-slate-500 italic">Aucune donnée enregistrée</td></tr>`;
                return;
            }

            weightData.forEach(item => {
                const dt = new Date(item.date);
                const formattedDate = dt.toLocaleDateString('fr-FR') + ' à ' + dt.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
                
                const tr = document.createElement('tr');
                tr.className = "hover:bg-white/5 transition-all";
                tr.innerHTML = `
                    <td class="p-3 text-slate-300 font-medium">${formattedDate}</td>
                    <td class="p-3 text-pink-400 font-black">${item.weight.toFixed(3)} kg</td>
                    <td class="p-3 text-right">
                        <button onclick="deleteEntry(${item.id})" class="bg-red-500/10 hover:bg-red-500/20 text-red-400 p-2 rounded-lg transition-all" title="Supprimer">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Ajouter une mesure
        document.getElementById('weight-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const dateVal = document.getElementById('input-date').value;
            const weightVal = parseFloat(document.getElementById('input-weight').value);

            if (dateVal && !isNaN(weightVal)) {
                weightData.push({
                    id: Date.now(),
                    date: dateVal,
                    weight: weightVal
                });
                document.getElementById('input-weight').value = '';
                updateUI();
            }
        });

        // Supprimer une mesure
        function deleteEntry(id) {
            weightData = weightData.filter(item => item.id !== id);
            updateUI();
        }

        // Lancement initial
        updateUI();
    </script>
</body>
</html>
