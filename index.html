<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BABY PREDICT - Suivi de poids</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 p-4 md:p-8 font-sans">
  <div class="max-w-4xl mx-auto space-y-6">
    
    <!-- Titre -->
    <header class="text-center">
      <h1 class="text-2xl md:text-3xl font-bold text-indigo-600">BABY PREDICT</h1>
      <p class="text-sm text-slate-500">Suivi et courbe de poids</p>
    </header>

    <!-- Formulaire d'ajout -->
    <form id="weightForm" class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 flex flex-col sm:flex-row gap-3 items-end">
      <div class="w-full sm:flex-1">
        <label for="dateInput" class="block text-xs font-semibold text-slate-600 mb-1">Date</label>
        <input type="date" id="dateInput" required class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
      </div>
      <div class="w-full sm:flex-1">
        <label for="weightInput" class="block text-xs font-semibold text-slate-600 mb-1">Poids (kg)</label>
        <input type="number" id="weightInput" step="0.01" min="0" placeholder="ex: 3.45" required class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
      </div>
      <button type="submit" class="w-full sm:w-auto px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg text-sm transition">
        Ajouter
      </button>
    </form>

    <!-- Graphique & Liste -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      
      <!-- Graphique -->
      <div class="lg:col-span-2 bg-white p-4 rounded-xl shadow-sm border border-slate-100 min-h-[300px]">
        <canvas id="weightChart"></canvas>
      </div>

      <!-- Historique -->
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 flex flex-col h-[320px]">
        <h2 class="text-sm font-bold text-slate-700 mb-3">Historique des mesures</h2>
        <ul id="weightList" class="overflow-y-auto space-y-2 pr-1 flex-1 text-sm">
          <!-- Les points s'affichent ici -->
        </ul>
      </div>

    </div>
  </div>

  <script>
    // Données initiales
    let weightData = [
      { id: 1, date: "2026-08-01", weight: 3.20 },
      { id: 2, date: "2026-08-03", weight: 3.28 },
      { id: 3, date: "2026-08-05", weight: 3.35 }
    ];

    // Initialisation du formulaire avec la date du jour
    document.getElementById('dateInput').value = new Date().toISOString().split('T')[0];

    // Configuration Chart.js
    const ctx = document.getElementById('weightChart').getContext('2d');
    const chart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: [],
        datasets: [{
          label: 'Poids (kg)',
          data: [],
          borderColor: '#4f46e5',
          backgroundColor: 'rgba(79, 70, 229, 0.1)',
          borderWidth: 2,
          fill: true,
          tension: 0.3,
          pointRadius: 5,
          pointHoverRadius: 7
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        onClick: (evt, activeElements) => {
          // Suppression au clic direct sur un point du graphique
          if (activeElements.length > 0) {
            const index = activeElements[0].index;
            const targetId = weightData[index].id;
            deleteMeasure(targetId);
          }
        },
        plugins: {
          tooltip: {
            callbacks: {
              footer: () => 'Cliquez sur le point pour supprimer'
            }
          }
        },
        scales: {
          y: { beginAtZero: false, title: { display: true, text: 'kg' } }
        }
      }
    });

    // Tri par date + mise à jour UI
    function updateUI() {
      weightData.sort((a, b) => new Date(a.date) - new Date(b.date));

      // Mise à jour du graphique
      chart.data.labels = weightData.map(d => formatDate(d.date));
      chart.data.datasets[0].data = weightData.map(d => d.weight);
      chart.update();

      // Mise à jour de la liste
      const listContainer = document.getElementById('weightList');
      listContainer.innerHTML = '';

      if (weightData.length === 0) {
        listContainer.innerHTML = '<li class="text-xs text-slate-400 text-center py-4">Aucune mesure enregistrée.</li>';
        return;
      }

      weightData.slice().reverse().forEach(item => {
        const li = document.createElement('li');
        li.className = 'flex justify-between items-center bg-slate-50 p-2.5 rounded-lg border border-slate-100';
        li.innerHTML = `
          <div>
            <span class="font-medium text-slate-700">${item.weight} kg</span>
            <span class="text-xs text-slate-400 block">${formatDate(item.date)}</span>
          </div>
          <button onclick="deleteMeasure(${item.id})" class="text-rose-500 hover:text-rose-700 hover:bg-rose-50 p-1 rounded transition text-xs">
            Supprimer
          </button>
        `;
        listContainer.appendChild(li);
      });
    }

    function addMeasure(date, weight) {
      weightData.push({ id: Date.now(), date, weight: parseFloat(weight) });
      updateUI();
    }

    function deleteMeasure(id) {
      weightData = weightData.filter(item => item.id !== id);
      updateUI();
    }

    function formatDate(dateStr) {
      const [year, month, day] = dateStr.split('-');
      return `${day}/${month}/${year}`;
    }

    // Événement formulaire
    document.getElementById('weightForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const date = document.getElementById('dateInput').value;
      const weight = document.getElementById('weightInput').value;
      if (date && weight) {
        addMeasure(date, weight);
        document.getElementById('weightInput').value = '';
      }
    });

    // Lancement initial
    updateUI();
  </script>
</body>
</html>
