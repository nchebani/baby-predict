<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BABY PREDICT 2026 - Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background: #07070a; color: #e2e8f0; font-family: 'Inter', sans-serif; margin: 0; min-height: 100vh; }
        .glass { background: rgba(23, 23, 33, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.05); }
        
        .admin-only { display: none !important; }
        .is-admin .admin-only { display: flex !important; }
        button.admin-only.is-block { display: block !important; }
        
        .tab-content { display: none; padding-bottom: 140px; }
        .tab-content.active { display: block; }
        .page { position: fixed; inset: 0; z-index: 100; background: #07070a; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .hidden { display: none !important; }
        #push-alert { transform: translateY(-130%); transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 9999; }
        #push-alert.show { transform: translateY(20px); }
        .gender-btn.selected-pink { background: #db2777 !important; border-color: #f472b6; color: white; }
        .gender-btn.selected-blue { background: #2563eb !important; border-color: #60a5fa; color: white; }

        /* OPTIMISATION DE L'IMPRESSION PDF */
        @media print {
            body, html { background: white !important; color: black !important; height: auto !important; overflow: visible !important; }
            nav, header, #push-alert, .page, .no-print, .tab-content:not(#tab-tracker) { display: none !important; }
            
            #tab-tracker { display: block !important; padding: 0 !important; width: 100% !important; margin: 0 !important; position: absolute !important; left: 0 !important; top: 0 !important; }
            
            .glass { background: none !important; border: 1px solid #ccc !important; backdrop-filter: none !important; box-shadow: none !important; color: black !important; border-radius: 8px !important; margin-bottom: 15px !important; }
            table { width: 100% !important; border: 1px solid #000 !important; color: black !important; border-collapse: collapse !important; }
            th, td { border: 1px solid #ccc !important; color: black !important; padding: 8px !important; }
            th { background-color: #f0f0f0 !important; }
            canvas { max-width: 100% !important; max-height: 250px !important; height: auto !important; }
            h3, h4, p, span, td, th { color: black !important; }
        }
    </style>
</head>
<body>

    <!-- ALERTES PUSH SATELLITE -->
    <div id="push-alert" class="fixed top-0 left-1/2 -translate-x-1/2 w-[90%] max-w-sm glass p-4 rounded-3xl border-l-4 border-purple-500 shadow-2xl flex items-center gap-3">
        <div class="bg-purple-500/20 w-10 h-10 rounded-full flex items-center justify-center text-purple-500"><i class="fas fa-baby"></i></div>
        <div class="flex-1">
            <p id="push-title" class="text-[10px] font-black uppercase text-purple-400 italic">Baby Predict</p>
            <p id="push-body" class="text-xs text-white">Message...</p>
        </div>
    </div>

    <!-- APPLICATION PRINCIPALE -->
    <div id="main-app" class="min-h-screen">
        <header class="p-6 flex justify-between items-center sticky top-0 bg-[#07070a]/90 backdrop-blur-xl z-40 border-b border-white/5">
            <div>
                <h2 class="font-black italic text-xl uppercase tracking-tighter">Baby <span class="text-purple-400">Predict</span></h2>
            </div>
        </header>

        <main class="p-4 max-w-lg mx-auto">
            <section id="tab-tracker" class="tab-content active space-y-6">
                <!-- CARTE DERNIER POIDS -->
                <div class="glass p-4 rounded-2xl border border-white/5 flex justify-between items-center">
                    <div>
                        <span class="text-[9px] font-bold text-slate-400 uppercase block">⚖️ Dernier Poids enregistré</span>
                        <p id="last-weight" class="text-2xl font-black text-purple-400 mt-1">-- kg</p>
                    </div>
                </div>

                <!-- GRAPHIQUE POIDS & GESTION -->
                <div class="glass p-5 rounded-[2.5rem] border border-white/10 space-y-4">
                    <h4 class="text-xs font-black uppercase text-purple-400 italic flex items-center justify-between">
                        <span><i class="fas fa-weight-hanging mr-2"></i> Courbe de Poids (kg)</span>
                        <span class="text-[9px] text-slate-500 font-normal">Cliquez sur un point pour supprimer</span>
                    </h4>

                    <div class="w-full h-52">
                        <canvas id="weightChart"></canvas>
                    </div>

                    <!-- FORMULAIRE AJOUT DE POIDS -->
                    <div class="bg-white/5 p-4 rounded-2xl border border-white/5 space-y-3 no-print">
                        <span class="text-[10px] font-black uppercase text-purple-300 block">Ajouter une mesure</span>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="text-[9px] font-bold text-slate-400 block mb-1">Date</label>
                                <input type="date" id="weight-date" class="w-full bg-black/40 border border-white/10 p-2 rounded-xl text-xs text-white outline-none">
                            </div>
                            <div>
                                <label class="text-[9px] font-bold text-slate-400 block mb-1">Poids (kg)</label>
                                <input type="number" step="0.01" id="weight-value" placeholder="ex: 3.45" class="w-full bg-black/40 border border-white/10 p-2 rounded-xl text-xs text-white outline-none">
                            </div>
                        </div>
                        <button onclick="addWeightMeasure()" class="w-full bg-purple-600 hover:bg-purple-500 text-white font-black py-2.5 rounded-xl text-xs uppercase tracking-wider transition-all">
                            <i class="fas fa-plus mr-1"></i> Valider la pesée
                        </button>
                    </div>

                    <!-- HISTORIQUE INTERACTIF -->
                    <div class="space-y-2">
                        <span class="text-[10px] font-black uppercase text-slate-400 block">Historique des pesées</span>
                        <div id="weight-list" class="max-h-40 overflow-y-auto space-y-1.5 pr-1 text-xs">
                            <!-- Les entrées seront insérées dynamiquement -->
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script>
        // Données d'exemple initiales (Triées chronologiquement)
        let weightData = [
            { id: 1, date: '2026-08-01', weight: 3.20 },
            { id: 2, date: '2026-08-03', weight: 3.28 },
            { id: 3, date: '2026-08-05', weight: 3.35 }
        ];

        let weightChartInstance = null;

        // Initialisation de la date d'aujourd'hui dans le champ
        document.getElementById('weight-date').valueAsDate = new Date();

        function initWeightChart() {
            const ctx = document.getElementById('weightChart').getContext('2d');
            
            weightChartInstance = new Chart(ctx, {
                type: 'line',
                data: getChartData(),
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    onClick: (e, elements) => {
                        if (elements.length > 0) {
                            const index = elements[0].index;
                            const item = weightData[index];
                            if (confirm(`Supprimer la mesure du ${item.date} (${item.weight} kg) ?`)) {
                                removeWeightMeasure(item.id);
                            }
                        }
                    },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: (ctx) => `${ctx.parsed.y} kg`
                            }
                        }
                    },
                    scales: {
                        x: {
                            ticks: { color: '#94a3b8', font: { size: 10 } },
                            grid: { color: 'rgba(255, 255, 255, 0.05)' }
                        },
                        y: {
                            ticks: { color: '#94a3b8', font: { size: 10 } },
                            grid: { color: 'rgba(255, 255, 255, 0.05)' }
                        }
                    }
                }
            });
        }

        function getChartData() {
            return {
                labels: weightData.map(d => d.date),
                datasets: [{
                    label: 'Poids (kg)',
                    data: weightData.map(d => d.weight),
                    borderColor: '#c084fc',
                    backgroundColor: 'rgba(192, 132, 252, 0.15)',
                    borderWidth: 2,
                    fill: true,
                    tension: 0.3,
                    pointRadius: 5,
                    pointHoverRadius: 8,
                    pointBackgroundColor: '#c084fc'
                }]
            };
        }

        function updateUI() {
            // Trier par date
            weightData.sort((a, b) => new Date(a.date) - new Date(b.date));

            // Mise à jour du graphique
            if (weightChartInstance) {
                weightChartInstance.data = getChartData();
                weightChartInstance.update();
            }

            // Mise à jour du dernier poids
            const lastWeightEl = document.getElementById('last-weight');
            if (weightData.length > 0) {
                const last = weightData[weightData.length - 1];
                lastWeightEl.innerText = `${last.weight.toFixed(2)} kg`;
            } else {
                lastWeightEl.innerText = '-- kg';
            }

            // Mise à jour de la liste interactive
            const listEl = document.getElementById('weight-list');
            listEl.innerHTML = '';

            if (weightData.length === 0) {
                listEl.innerHTML = `<p class="text-slate-500 italic text-center py-2">Aucune pesée enregistrée</p>`;
                return;
            }

            weightData.slice().reverse().forEach(item => {
                const row = document.createElement('div');
                row.className = 'flex justify-between items-center bg-white/5 p-2 rounded-xl border border-white/5';
                row.innerHTML = `
                    <span class="text-slate-300 font-bold">${item.date}</span>
                    <span class="text-purple-400 font-black">${item.weight.toFixed(2)} kg</span>
                    <button onclick="removeWeightMeasure(${item.id})" class="text-red-400 hover:text-red-300 p-1">
                        <i class="fas fa-trash-alt"></i>
                    </button>
                `;
                listEl.appendChild(row);
            });
        }

        function addWeightMeasure() {
            const dateInput = document.getElementById('weight-date');
            const weightInput = document.getElementById('weight-value');

            const date = dateInput.value;
            const weight = parseFloat(weightInput.value);

            if (!date || isNaN(weight) || weight <= 0) {
                alert("Veuillez saisir une date et un poids valide.");
                return;
            }

            weightData.push({
                id: Date.now(),
                date: date,
                weight: weight
            });

            weightInput.value = '';
            updateUI();
        }

        function removeWeightMeasure(id) {
            weightData = weightData.filter(d => d.id !== id);
            updateUI();
        }

        document.addEventListener('DOMContentLoaded', () => {
            initWeightChart();
            updateUI();
        });
    </script>
</body>
</html>
